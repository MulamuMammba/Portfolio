    <rect x="236" y="66" width="168" height="72" rx="8" fill="#a0d49b"/>
    <circle cx="282" cy="102" r="20" fill="#3f3d56"/>
    <circle cx="282" cy="102" r="9" fill="#dfe8db"/>
